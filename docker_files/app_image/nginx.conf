server {
    listen 80;
    server_name _;

    # Standard-Verzeichnis für alle Anfragen
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Haupt-Routing für die Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Exakter Treffer für die index.html (kein Caching)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 3. Exakter Treffer für die config.json (kein Caching)
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 4. Exakter Treffer für die manifest.json (kein Caching, falls verwendet)
    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}