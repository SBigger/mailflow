services:
  frontend:
    image: 'brsoftswiss/smartis:1.5.0'
    restart: always
    environment:
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  default:
    name: coolify-infra
    external: true