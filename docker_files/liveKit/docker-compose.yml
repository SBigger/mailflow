version: '3.8'
services:
  livekit:
    image: 'livekit/livekit-server:latest'
    container_name: livekit-server
    entrypoint: "/bin/sh -c \"echo \\\"$$LIVEKIT_CONFIG\\\" > /livekit.yaml && exec /livekit-server --config /livekit.yaml\"\n"
    environment:
      LIVEKIT_CONFIG: "port: 7880\nbind_addresses:\n  - 0.0.0.0\nrtc:\n  tcp_port: 7881\n  udp_port: 7882\n  node_ip: ${LIVEKIT_NODE_IP}\nredis:\n  # Wir nutzen hier den exakten Netzwerknamen von unten\n  address: livekit-redis-internal:6379\nkeys:\n  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}\n"
    ports:
      - '7881:7881'
      - '7882:7882/udp'
    labels:
      - coolify.managed=true
      - coolify.proxy.port=7880
    networks:
      livekit-private:
        aliases:
          - livekit-server-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'nc -z localhost 7880 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis:
    image: 'redis:7-alpine'
    container_name: livekit-redis
    command: 'redis-server --appendonly yes'
    volumes:
      - 'livekit_redis_data:/data'
    networks:
      livekit-private:
        aliases:
          - livekit-redis-internal
    healthcheck:
      test:
        - CMD-SHELL
        - 'nc -z localhost 6379 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  livekit_redis_data: null
networks:
  livekit-private:
    driver: bridge
