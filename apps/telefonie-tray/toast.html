<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Eingehender Anruf</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag;
    animation: enter 250ms cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card {
    height: 100%;
    background: #fcfcfc;
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 8px;
    box-shadow: 0 0 2px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.14);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .row { display: flex; align-items: center; gap: 12px; -webkit-app-region: no-drag; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #e5f0e6;
    color: #2d6a34; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,.06);
  }
  .info { min-width: 0; }
  .label { font-size: 12px; font-weight: 400; color: rgba(0,0,0,.61); }
  .name {
    font-size: 14px; font-weight: 600; color: rgba(0,0,0,.896);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .number { font-size: 12px; font-weight: 400; color: rgba(0,0,0,.61); margin-top: 1px; }
  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; -webkit-app-region: no-drag; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 100ms ease, filter 100ms ease;
  }
  .icon-btn:hover { filter: brightness(1.08); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.dismiss { background: rgba(0,0,0,.05); }
  .icon-btn.dismiss svg { stroke: rgba(0,0,0,.61); }
  .icon-btn.open { background: #107C10; }
  .icon-btn.open svg { stroke: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="avatar" id="avatar">?</div>
      <div class="info">
        <div class="label" id="label">Eingehender Anruf</div>
        <div class="name" id="name">Unbekannt</div>
        <div class="number" id="number"></div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn dismiss" title="Schliessen" onclick="window.toastAPI.dismiss()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="icon-btn open" title="Öffnen" onclick="window.toastAPI.open()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
  <script>
    const STATUS_LABEL = {
      ringing: 'Eingehender Anruf',
      answered: 'Im Gespräch',
      ended: 'Anruf beendet',
    };
    function render({ name, number, status }) {
      name = name || 'Unbekannt';
      document.getElementById('label').textContent = STATUS_LABEL[status] || STATUS_LABEL.ringing;
      document.getElementById('name').textContent = name;
      document.getElementById('number').textContent = number || '';
      document.getElementById('avatar').textContent = name.slice(0, 2).toUpperCase();
    }
    const params = new URLSearchParams(window.location.search);
    render({
      name: params.get('name'),
      number: params.get('number'),
      status: params.get('status'),
    });
    window.toastAPI.onUpdate(render);
  </script>
</body>
</html>
