<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartis – Einrichtung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f9f4;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #2d3a2d;
  }
  .card {
    background: #fff;
    border: 1px solid #c8dac8;
    border-radius: 16px;
    padding: 36px 40px;
    width: 420px;
    box-shadow: 0 8px 32px rgba(45,58,45,0.10);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .logo svg { color: #7a9b7f; }
  .logo-text { font-size: 20px; font-weight: 700; color: #2d3a2d; }
  .logo-sub { font-size: 12px; color: #6b826b; margin-top: 1px; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #2d3a2d; }
  p { font-size: 13px; color: #6b826b; margin-bottom: 20px; line-height: 1.5; }
  label { font-size: 12px; font-weight: 600; color: #6b826b; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #c8dac8;
    border-radius: 8px;
    font-size: 14px;
    color: #2d3a2d;
    background: #f4f9f4;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: #7a9b7f; background: #fff; }
  .error { color: #ef4444; font-size: 12px; margin-top: 6px; display: none; }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    background: #7a9b7f;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .88; }
  button:active { opacity: .75; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <div>
      <div class="logo-text">Smartis</div>
      <div class="logo-sub">by Artis Treuhand</div>
    </div>
  </div>
  <h2>Willkommen bei Smartis</h2>
  <p>Bitte gib die URL deiner Smartis-Instanz ein. Diese Einstellung wird lokal gespeichert und kann jederzeit über das Tray-Icon geändert werden.</p>
  <label for="url">Smartis-URL</label>
  <input
    type="url"
    id="url"
    placeholder="https://meine-firma.sm-artis.ch"
    autofocus
  />
  <div class="error" id="error">Bitte eine gültige URL eingeben (beginnt mit https://)</div>
  <button onclick="save()">Verbinden</button>
</div>
<script>
  // Vorausgefüllter Wert falls vorhanden
  const params = new URLSearchParams(window.location.search);
  const current = params.get('current');
  if (current) document.getElementById('url').value = current;

  function save() {
    const val = document.getElementById('url').value.trim();
    const err = document.getElementById('error');
    if (!val.startsWith('http://') && !val.startsWith('https://')) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    // URL ohne trailing slash
    const clean = val.replace(/\/$/, '');
    window.electronAPI.saveUrl(clean);
  }

  document.getElementById('url').addEventListener('keydown', e => {
    if (e.key === 'Enter') save();
  });
</script>
</body>
</html>
