<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoginPilot</title>
<style>
  :root {
    --bg:        #0f172a;
    --surface:   #1e293b;
    --surface2:  #263448;
    --border:    #334155;
    --text:      #e2e8f0;
    --muted:     #94a3b8;
    --accent:    #3b82f6;
    --accent-h:  #2563eb;
    --danger:    #ef4444;
    --success:   #22c55e;
    --radius:    10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-app-region: no-drag;
    user-select: none;
  }

  /* ── Panels ── */
  #list-panel, #edit-panel {
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: transform .22s ease, opacity .22s ease;
  }
  #edit-panel {
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }
  #edit-panel.visible {
    transform: translateX(0);
    opacity: 1;
    pointer-events: all;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
  .header h2 { font-size: 16px; font-weight: 600; flex: 1; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Buttons ── */
  button { cursor: pointer; border: none; outline: none; font-family: inherit; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 20px;
    line-height: 1;
    transition: color .15s, background .15s;
  }
  .btn-ghost:hover { color: var(--text); background: var(--surface2); }

  .btn-icon {
    background: transparent;
    color: var(--muted);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1;
    transition: color .15s, background .15s;
  }
  .btn-icon:hover { color: var(--text); background: var(--surface2); }
  .btn-icon.danger:hover { color: var(--danger); background: rgba(239,68,68,.1); }

  /* ── List ── */
  #login-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #login-list::-webkit-scrollbar { width: 5px; }
  #login-list::-webkit-scrollbar-track { background: transparent; }
  #login-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 60px;
    font-size: 14px;
    line-height: 1.7;
  }
  .empty span { font-size: 40px; display: block; margin-bottom: 10px; }

  /* ── Login-Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }

  .card-emoji {
    font-size: 26px;
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-url {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .btn-login {
    background: var(--accent);
    color: #fff;
    padding: 6px 13px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2px;
    transition: background .15s, transform .1s;
  }
  .btn-login:hover { background: var(--accent-h); transform: scale(1.03); }
  .btn-login:active { transform: scale(.97); }
  .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-login.loading { background: var(--surface2); color: var(--muted); }

  /* ── Edit-Panel ── */
  #edit-panel .header { padding: 14px 12px 12px; }

  .form-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .form-body::-webkit-scrollbar { width: 5px; }
  .form-body::-webkit-scrollbar-track { background: transparent; }
  .form-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    padding: 8px 11px;
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input[type="password"] { font-family: monospace; letter-spacing: 2px; }
  .field .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 4px 0 2px;
    border-bottom: 1px solid var(--border);
  }

  .toggle-advanced {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    text-align: center;
    transition: color .15s, border-color .15s;
  }
  .toggle-advanced:hover { color: var(--text); border-color: var(--accent); }

  .advanced-fields { display: none; flex-direction: column; gap: 14px; }
  .advanced-fields.open { display: flex; }

  .form-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .form-footer .btn-primary { flex: 1; padding: 10px; font-size: 14px; }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
  }
  .btn-secondary:hover { background: var(--border); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #1a3a1a;
    border: 1px solid var(--success);
    color: var(--success);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: transform .2s, opacity .2s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #toast.error {
    background: #3a1a1a;
    border-color: var(--danger);
    color: var(--danger);
  }
</style>
</head>
<body>

<!-- ══════════════════ LIST-PANEL ══════════════════ -->
<div id="list-panel">
  <div class="header">
    <h1>🔑 LoginPilot</h1>
    <button class="btn-primary" id="btn-add">+ Neu</button>
  </div>
  <div id="login-list"></div>
</div>

<!-- ══════════════════ EDIT-PANEL ══════════════════ -->
<div id="edit-panel">
  <div class="header">
    <button class="btn-ghost" id="btn-back">←</button>
    <h2 id="edit-title">Login bearbeiten</h2>
  </div>

  <div class="form-body">
    <div class="field-row">
      <div class="field" style="flex: 0 0 70px;">
        <label>Emoji</label>
        <input id="f-icon" type="text" placeholder="🌐" maxlength="4">
      </div>
      <div class="field">
        <label>Name *</label>
        <input id="f-name" type="text" placeholder="z. B. PostFinance">
      </div>
    </div>

    <div class="field">
      <label>Login-URL *</label>
      <input id="f-url" type="url" placeholder="https://…">
    </div>

    <div class="section-title">Zugangsdaten</div>

    <div class="field">
      <label>Benutzername / E-Finance-Nr.</label>
      <input id="f-username" type="text" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label>Passwort</label>
      <input id="f-password" type="password" autocomplete="off">
      <div class="hint">Wird verschlüsselt gespeichert (Windows DPAPI / macOS Keychain).</div>
    </div>

    <!-- Fortgeschrittene Einstellungen -->
    <button class="toggle-advanced" id="btn-toggle-adv">⚙ Erweiterte Einstellungen anzeigen</button>

    <div class="advanced-fields" id="adv-fields">
      <div class="section-title">CSS-Selektoren (optional)</div>

      <div class="field">
        <label>Benutzername-Feld</label>
        <input id="f-userSel" type="text" placeholder='input[name="login"]' autocomplete="off" spellcheck="false">
        <div class="hint">Leer lassen → automatisch das erste sichtbare Textfeld.</div>
      </div>

      <div class="field">
        <label>Passwort-Feld</label>
        <input id="f-passSel" type="text" placeholder='input[type="password"]' autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label>Anmelde-Button</label>
        <input id="f-submitSel" type="text" placeholder='button[type="submit"]' autocomplete="off" spellcheck="false">
        <div class="hint">Leer lassen → kein Auto-Submit (du drückst manuell Enter).</div>
      </div>

      <div class="field" style="max-width: 140px;">
        <label>Verzögerung (ms)</label>
        <input id="f-delay" type="number" min="0" max="10000" step="100" value="1500">
        <div class="hint">Wartezeit nach Seitenladung.</div>
      </div>
    </div>
  </div>

  <div class="form-footer">
    <button class="btn-secondary" id="btn-cancel">Abbrechen</button>
    <button class="btn-primary" id="btn-save">Speichern</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────

  let logins    = [];
  let editingId = null;
  let advOpen   = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ── Init ───────────────────────────────────────────────────────────────────

  window.addEventListener('DOMContentLoaded', async () => {
    logins = await window.api.loadLogins();
    renderList();
  });

  // ── Render ─────────────────────────────────────────────────────────────────

  function renderList() {
    const el = document.getElementById('login-list');

    if (logins.length === 0) {
      el.innerHTML = `
        <div class="empty">
          <span>🔑</span>
          Noch keine Logins gespeichert.<br>
          Klicke auf <strong>+ Neu</strong> um loszulegen.
        </div>`;
      return;
    }

    el.innerHTML = logins.map(l => `
      <div class="card" id="card-${l.id}">
        <div class="card-emoji">${escHtml(l.icon || '🌐')}</div>
        <div class="card-info">
          <div class="card-name">${escHtml(l.name)}</div>
          <div class="card-url">${escHtml(stripProto(l.url))}</div>
        </div>
        <div class="card-actions">
          <button class="btn-login" data-id="${l.id}" onclick="doLogin(this)">▶ Login</button>
          <button class="btn-icon"  onclick="editLogin('${l.id}')" title="Bearbeiten">✏</button>
          <button class="btn-icon danger" onclick="deleteLogin('${l.id}')" title="Löschen">🗑</button>
        </div>
      </div>
    `).join('');
  }

  // ── Login starten ──────────────────────────────────────────────────────────

  async function doLogin(btn) {
    const id    = btn.dataset.id;
    const login = logins.find(l => l.id === id);
    if (!login) return;

    btn.textContent = '⏳ …';
    btn.disabled = true;
    btn.classList.add('loading');

    const result = await window.api.startLogin(login);

    setTimeout(() => {
      btn.textContent = '▶ Login';
      btn.disabled = false;
      btn.classList.remove('loading');
    }, 2500);

    if (!result?.ok) {
      showToast('Fehler: ' + (result?.error || 'Unbekannt'), true);
    }
  }

  // ── Bearbeiten ─────────────────────────────────────────────────────────────

  function editLogin(id) {
    editingId = id || null;
    const l = id ? logins.find(x => x.id === id) : null;

    document.getElementById('edit-title').textContent = l ? l.name + ' bearbeiten' : 'Neuer Login';
    document.getElementById('f-icon').value       = l?.icon       || '';
    document.getElementById('f-name').value       = l?.name       || '';
    document.getElementById('f-url').value        = l?.url        || '';
    document.getElementById('f-username').value   = l?.username   || '';
    document.getElementById('f-password').value   = l?.password   || '';
    document.getElementById('f-userSel').value    = l?.userSelector   || '';
    document.getElementById('f-passSel').value    = l?.passSelector   || '';
    document.getElementById('f-submitSel').value  = l?.submitSelector || '';
    document.getElementById('f-delay').value      = l?.delay ?? 1500;

    // Erweiterte Einstellungen: nur öffnen, wenn etwas drin steht
    const hasAdv = l?.userSelector || l?.passSelector || l?.submitSelector;
    setAdv(!!hasAdv);

    showEditPanel();
  }

  function deleteLogin(id) {
    if (!confirm('Login-Eintrag wirklich löschen?')) return;
    logins = logins.filter(l => l.id !== id);
    window.api.saveLogins(logins);
    renderList();
    showToast('Gelöscht');
  }

  // ── Speichern ──────────────────────────────────────────────────────────────

  document.getElementById('btn-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const url  = document.getElementById('f-url').value.trim();

    if (!name) { shake('f-name'); return; }
    if (!url)  { shake('f-url');  return; }

    const updated = {
      id:             editingId || uid(),
      icon:           document.getElementById('f-icon').value.trim() || '🌐',
      name,
      url,
      username:       document.getElementById('f-username').value,
      password:       document.getElementById('f-password').value,
      userSelector:   document.getElementById('f-userSel').value.trim(),
      passSelector:   document.getElementById('f-passSel').value.trim(),
      submitSelector: document.getElementById('f-submitSel').value.trim(),
      delay:          parseInt(document.getElementById('f-delay').value) || 1500,
    };

    if (editingId) {
      logins = logins.map(l => l.id === editingId ? updated : l);
    } else {
      logins.push(updated);
    }

    window.api.saveLogins(logins);
    showListPanel();
    renderList();
    showToast('Gespeichert ✓');
  });

  // ── Panel-Wechsel ──────────────────────────────────────────────────────────

  function showEditPanel() {
    document.getElementById('edit-panel').classList.add('visible');
  }
  function showListPanel() {
    document.getElementById('edit-panel').classList.remove('visible');
  }

  document.getElementById('btn-add').addEventListener('click', () => editLogin(null));
  document.getElementById('btn-back').addEventListener('click', showListPanel);
  document.getElementById('btn-cancel').addEventListener('click', showListPanel);

  // ── Erweiterte Einstellungen ───────────────────────────────────────────────

  function setAdv(open) {
    advOpen = open;
    const fields = document.getElementById('adv-fields');
    const btn    = document.getElementById('btn-toggle-adv');
    if (open) {
      fields.classList.add('open');
      btn.textContent = '⚙ Erweiterte Einstellungen ausblenden';
    } else {
      fields.classList.remove('open');
      btn.textContent = '⚙ Erweiterte Einstellungen anzeigen';
    }
  }

  document.getElementById('btn-toggle-adv').addEventListener('click', () => setAdv(!advOpen));

  // ── Hilfsfunktionen ────────────────────────────────────────────────────────

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function stripProto(url) {
    return (url || '').replace(/^https?:\/\//, '');
  }

  function shake(fieldId) {
    const el = document.getElementById(fieldId);
    el.style.borderColor = 'var(--danger)';
    el.style.animation = 'none';
    el.focus();
    setTimeout(() => { el.style.borderColor = ''; }, 1500);
  }

  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 2400);
  }
</script>
</body>
</html>
