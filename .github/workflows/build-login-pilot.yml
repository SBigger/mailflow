name: Build LoginPilot (Windows)

on:
  push:
    paths:
      - 'apps/login-pilot/**'
    branches:
      - 'claude/desktop-login-automation-1yp40z'
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/login-pilot
        run: npm install

      - name: Build portable app
        working-directory: apps/login-pilot
        run: npx electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Zip win-unpacked
        working-directory: apps/login-pilot
        run: Compress-Archive -Path dist\win-unpacked -DestinationPath LoginPilot-portable.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoginPilot-portable
          path: apps/login-pilot/LoginPilot-portable.zip
          retention-days: 30
